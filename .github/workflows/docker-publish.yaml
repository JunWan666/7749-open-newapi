# 7749 自建镜像：源码 → ghcr.io 镜像
#
# 触发：push tag（v*）或网页 Actions → Run workflow 手动构建
# 只用 GITHUB_TOKEN，不需要配置任何 secret。
# 只构建 linux/amd64（服务器是 x86），比上游多架构快一半。

name: Build 7749 Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号（留空则用手动运行时的默认值 dev）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/junwan666/7749-open-newapi

jobs:
  build:
    name: Build & push (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 计算镜像版本
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            case "${{ github.ref }}" in
              refs/tags/*) V="${GITHUB_REF_NAME}" ;;
              *)           V="dev" ;;
            esac
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "$V" > VERSION
          echo "本次构建版本：$V"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 汇总
        run: |
          echo "### 镜像已推送 ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE }}:${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
